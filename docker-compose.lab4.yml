version: '3.8'

services:
  api1:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PORT=5000
    command: >-
      sh -c "pip install --no-cache-dir Flask==2.2.5 Flask-Cors==3.0.10 && python lab/lab3/api.py"

  api2:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - PORT=5000
    command: >-
      sh -c "pip install --no-cache-dir Flask==2.2.5 Flask-Cors==3.0.10 && python lab/lab3/api.py"

  nginx:
    image: nginx:alpine
    depends_on:
      - api1
      - api2
    ports:
      - "5000:80"
    volumes:
      - ./lab/lab4/nginx.conf:/etc/nginx/nginx.conf:ro
